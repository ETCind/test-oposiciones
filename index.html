<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3157d5">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; media-src 'none';">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Test Oposiciones">
  <title>Test Oposiciones</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css?build=ghsafe-v1-20260826">
</head>
<body>
  <main class="app-shell">
    <header class="topbar no-print">
      <button id="homeBtn" class="brand" aria-label="Biblioteca"><span>📝</span><span>Test Oposiciones</span></button>
      <div id="topActions" class="top-actions"></div>
    </header>
    <section id="libraryView" class="view"></section>
    <section id="trashView" class="view hidden"></section>
    <section id="importView" class="view hidden"></section>
    <section id="editView" class="view hidden"></section>
    <section id="quizView" class="view hidden"></section>
    <section id="resultView" class="view hidden"></section>
    <section id="reviewView" class="view hidden"></section>
    <section id="printReport" class="print-only"></section>
  </main>

  <dialog id="importDialog">
    <form method="dialog" class="dialog-body" id="importForm">
      <h2>Importar tests desde PDF</h2>
      <p>La importación de PDF está desactivada en esta copia privada móvil. Hazla en el Mac y actualiza después la biblioteca maestra de iCloud.</p>
      <label class="field"><span>Tema</span><input id="importTopic" type="text"></label>
      <label class="field"><span>PDF</span><input id="pdfFiles" type="file" accept="application/pdf,.pdf" multiple></label>
      <div id="importProgress" class="progress-note hidden"></div>
      <div class="dialog-actions"><button type="button" class="ghost" id="cancelImport">Cancelar</button><button type="button" class="primary" id="processImport">Analizar PDF</button></div>
    </form>
  </dialog>

  <input id="backupFile" type="file" accept="application/json,.json" class="hidden">
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="seed-library.js?build=ghsafe-v1-20260826"></script>
  <script src="sync-core.js?build=ghsafe-v1-20260826"></script>
  <script src="db.js?build=ghsafe-v1-20260826"></script>
  <script src="parser-core.js?build=ghsafe-v1-20260826"></script>
  <script src="pdf-importer.js?build=ghsafe-v1-20260826"></script>
  <script src="report-core.js?build=ghsafe-v1-20260826"></script>
  <script src="app.js?build=ghsafe-v1-20260826"></script>
  <script src="private-mobile.js?build=ghsafe-v1-20260826"></script>
</body>
</html>
